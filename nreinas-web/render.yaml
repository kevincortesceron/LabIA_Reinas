# Configuracion para desplegar en Render (https://render.com)
# Render lee este archivo automaticamente si el repo lo tiene en la raiz.
services:
  - type: web
    name: nreinas-ag
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_DEBUG
        value: "0"
